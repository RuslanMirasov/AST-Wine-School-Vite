<!--ADD REVIEW POPUP-->
<div class="popup-content big" role="dialog" aria-modal="true" aria-labelledby="review-title" id="add-review">
  <div class="popup-title">
    <span id="review-title">Отзыв</span>
    <button class="popup-close" data-popup-close aria-label="Закрыть">
      <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
    </button>
  </div>

  <p class="popup-title fs-18" data-review-subject hidden></p>

  <form data-form action="#" class="form" novalidate onsubmit="onReviewSubmit(event)">
    <label class="label">
      <textarea name="review" class="input input--textarea" aria-label="Текст отзыва" placeholder="Расскажите, что вам запомнилось" required data-required-error-text="Пожалуйста, напишите ваш отзыв"></textarea>
    </label>
    <p class="popup-subtitle">Оставляя отзыв, вы соглашаетесь с <a href="#" class="link">условиями использования сайта</a>.</p>
    <button type="submit" class="button"><span>Оставить отзыв</span></button>
  </form>
</div>

<!--REVIEW SUCCESS POPUP-->
<div class="popup-content" id="add-review-success" role="dialog" aria-modal="true" aria-labelledby="review-success-title">
  <div class="popup-title">
    <span id="review-success-title">Отзыв</span>
    <button class="popup-close" data-popup-close aria-label="Закрыть">
      <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
    </button>
  </div>

  <p class="popup-title fs-18" data-review-subject hidden></p>

  <p class="text full ta--l">Спасибо! Ваш отзыв отправлен. Он&nbsp;появится после прохождения проверки.</p>

  <div class="buttons ta--l">
    <button type="button" class="button" data-popup-close><span>Закрыть</span></button>
  </div>
</div>

<script>
  const reviewSubject = document.querySelector('[data-review-subject-source]')?.textContent.trim();
  if (reviewSubject) {
    document.querySelectorAll('[data-review-subject]').forEach(element => {
      element.textContent = reviewSubject;
      element.hidden = false;
    });
  }

  function onReviewSubmit(e) {
    e.preventDefault();
    window.popup.open('add-review-success');
  }
</script>
