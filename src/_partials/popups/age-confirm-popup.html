<!--AGE-CONFIRM POPUP-->

<div class="popup-content" id="age-confirm" role="dialog" aria-modal="true" aria-labelledby="age-confirm-title">
  <h2 class="popup-title fs-40 regular magenta" id="login-title">
    <span>18+</span>
    <button class="popup-close" aria-label="Закрыть" data-popup-close>
      <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
    </button>
  </h2>

  <p class="text ta--l">
    Сайт содержит информацию, не&nbsp;рекомендованную для лиц, не&nbsp;достигших совершеннолетнего возраста. Для&nbsp;доступа на&nbsp;сайт
    подтвердите, пожалуйста, свое совершеннолетие.
  </p>

  <div class="buttons gap--20 ta--l">
    <button type="button" class="button" data-age-confirm data-popup-close><span>Мне есть 18 лет</span></button>
    <button type="button" class="button magenta-light" data-popup-close><span>Мне нет 18 лет</span></button>
  </div>
</div>
