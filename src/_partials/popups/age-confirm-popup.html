<!--AGE-CONFIRM POPUP-->
<div class="popup-content" data-popup-lock id="age-confirm" role="dialog" aria-modal="true" aria-labelledby="age-confirm-title">
  <h2 class="popup-title fs-40 regular magenta" id="age-confirm-title">
    <span>18+</span>
  </h2>

  <p class="text ta--l">
    Сайт содержит информацию, не&nbsp;рекомендованную для лиц, не&nbsp;достигших совершеннолетнего возраста. Для&nbsp;доступа на&nbsp;сайт
    подтвердите, пожалуйста, свое совершеннолетие.
  </p>

  <div class="buttons gap--12 ta--l">
    <button type="button" class="button" data-age-confirm data-popup-close><span>Мне есть 18 лет</span></button>
    <button type="button" class="button magenta-light" data-popup-open="age-not-valid"><span>Мне нет 18 лет</span></button>
  </div>
</div>

<!--AGE-NOT-VALID POPUP-->
<div class="popup-content" data-popup-lock id="age-not-valid" role="dialog" aria-modal="true" aria-labelledby="age-not-valid-title">
  <h2 class="popup-title fs-40 regular magenta" id="age-not-valid-title">
    <span>18+</span>
  </h2>

  <p class="text ta--l">Приходите позже! Сайт содержит информацию, доступную только с 18 лет.</p>

  <div class="buttons gap--12 ta--l">
    <button type="button" class="button" data-popup-open="age-confirm"><span>Назад</span></button>
  </div>
</div>
