<!--REVIEW SUCCESS POPUP-->
<div class="popup-content video-player-popup" id="video-player" role="dialog" aria-modal="true" aria-labelledby="review-success-title">
  <div class="player-close">
    <button class="popup-close" data-popup-close aria-label="Закрыть">
      <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
    </button>
  </div>

  <!--Плеер начало-->
  <div class="video-player is-paused" data-player>
    <video class="video-player-video" data-player-video preload="metadata" playsinline></video>

    <button type="button" class="player-play-button" data-player-toggle aria-label="Воспроизвести">
      <svg width="12" height="13"><use href="/assets/img/sprite.svg#play"></use></svg>
    </button>

    <div class="video-player-controls">
      <input
        type="range"
        class="video-player-range video-player-progress"
        data-player-progress
        min="0"
        max="100"
        step="0.1"
        value="0"
        aria-label="Перемотка"
      />

      <div class="video-player-bar">
        <button type="button" class="video-player-button video-player-toggle" data-player-toggle aria-label="Воспроизвести">
          <svg class="icon-play" width="16" height="18"><use href="/assets/img/sprite.svg#play"></use></svg>
          <svg class="icon-pause" width="24" height="24"><use href="/assets/img/sprite.svg#pause"></use></svg>
        </button>

        <button type="button" class="video-player-button video-player-mute" data-player-mute aria-label="Выключить звук">
          <svg width="24" height="24"><use href="/assets/img/sprite.svg#sound"></use></svg>
        </button>

        <input
          type="range"
          class="video-player-range video-player-volume"
          data-player-volume
          min="0"
          max="1"
          step="0.01"
          value="1"
          aria-label="Громкость"
        />

        <div class="video-player-time"><span data-player-current>00:00</span> / <span data-player-duration>00:00</span></div>

        <button
          type="button"
          class="video-player-button video-player-fullscreen"
          data-player-fullscreen
          aria-label="Полноэкранный режим"
        >
          <svg width="22" height="22"><use href="/assets/img/sprite.svg#fullscreen"></use></svg>
        </button>
      </div>
    </div>
  </div>
  <!--Плеер конец-->
</div>
