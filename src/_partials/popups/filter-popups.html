<!--ТИП МЕРОПРИЯТИЯ-->
<div class="popup-content small" role="dialog" aria-modal="true" aria-labelledby="event-type-title" id="event-type">
  <h2 class="title title--24 bold" id="event-type-title">
    Тип мероприятия
    <button class="popup-close" data-popup-close aria-label="Закрыть">
      <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
    </button>
  </h2>

  <fieldset class="filter-checkboxes">
    <label class="label">
      <input name="event-type[]" type="checkbox" class="checkbox" value="courses" form="filter-form" />
      <p class="label-text">Курсы</p>
    </label>
    <label class="label">
      <input name="event-type[]" type="checkbox" class="checkbox" value="degustations" form="filter-form" />
      <p class="label-text">Дегустации</p>
    </label>
    <label class="label">
      <input name="event-type[]" type="checkbox" class="checkbox" value="privat events" form="filter-form" />
      <p class="label-text">Частные мероприятия</p>
    </label>
  </fieldset>

  <div class="buttons gap--12">
    <button type="button" class="button white-border medium" data-popup-close>Отмена</button>
    <button type="submit" class="button magenta medium" form="filter-form">Применить</button>
  </div>
</div>
