<!--SUBSCRIBE POPUP-->
<div class="popup-content" id="subscribe" role="dialog" aria-modal="true" aria-labelledby="subscribe-title">
  <h2 class="title title--24 bold" id="login-title">
    Подписка на рассылку
    <button class="popup-close" data-popup-close aria-label="Закрыть">
      <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
    </button>
  </h2>

  <p class="popup-subtitle">Только анонсы мероприятий и&nbsp;нужные предложения — без&nbsp;спама</p>

  <script>
    function onSubscribeFormSubmit(e) {
      e.preventDefault();
      window.popup.open('subscribe-success');
    }
  </script>

  <form data-form action="#" class="form form--grey" novalidate onsubmit="onSubscribeFormSubmit(event)">
    <label class="label">
      <span class="label-text">Email</span>
      <input type="email" name="email" placeholder="Введите email" class="input subscribe-input" required autocomplete="email" />
    </label>

    <fieldset>
      <label class="label">
        <input name="confirmation" type="checkbox" class="checkbox" required data-error-title="Согласие на обработку данных обязательно" />
        <p class="label-text">
          <span>Согласен с&nbsp;<a href="%ROOT%" target="_blank">Условиями обработки персональных данных</a></span>
        </p>
      </label>
    </fieldset>

    <div class="buttons ta--l">
      <button type="submit" class="button medium magenta">Подписаться</button>
    </div>
  </form>
</div>

<!--SUBSCRIBE SUCCESS POPUP-->
<div class="popup-content" id="subscribe-success" role="dialog" aria-modal="true" aria-labelledby="subscribe-success-title">
  <button class="popup-close" data-popup-close aria-label="Закрыть">
    <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
  </button>
  <h2 class="title title--30" id="subscribe-success-title">Подписка оформлена</h2>
  <p class="popup-subtitle">Lorem ipsum dolor sit amet consectetur adipisicing elit. Ducimus rem pariatur esse, hic vel dignissimos natus.</p>
  <button type="button" class="button big" data-popup-close>Закрыть</button>
</div>
