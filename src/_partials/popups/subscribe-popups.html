<!--SUBSCRIBE POPUP-->
<div class="popup-content" id="subscribe">
  <button class="popup-close" data-popup-close>
    <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
  </button>
  <h2 class="title">Подписаться на новости</h2>
  <p class="popup-subtitle">Только анонсы мероприятий и&nbsp;нужные предложения — без&nbsp;спама</p>
  <script>
    function onSubscribeFormSubmit(e) {
      e.preventDefault();
      window.popup.open('subscribe-success');
    }
  </script>
  <form data-form action="#" class="form" novalidate onsubmit="onSubscribeFormSubmit(event)">
    <label class="label">
      <input type="email" name="email" placeholder="Введите email" class="input subscribe-input" required />
    </label>

    <button type="submit" class="button big magenta">
      Подписаться
      <svg width="21" height="21"><use href="/assets/img/sprite.svg#arrow-right"></use></svg>
    </button>
  </form>
</div>

<!--SUBSCRIBE SUCCESS POPUP-->
<div class="popup-content" id="subscribe-success">
  <button class="popup-close" data-popup-close>
    <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
  </button>
  <h2 class="title">Подписка оформлена</h2>
  <p class="popup-subtitle">Lorem ipsum dolor sit amet consectetur adipisicing elit. Ducimus rem pariatur esse, hic vel dignissimos natus.</p>
  <button type="button" class="button big" data-popup-close>Закрыть</button>
</div>
