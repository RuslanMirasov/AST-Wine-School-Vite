<div class="cookeis-backdrop" data-cookie-popup>
  <div class="cookeis-popup active">
    <div class="cookeis-popup-text">
      <p>Мы используем файлы cookie, чтобы вам было удобно пользоваться нашим сайтом</p>
      <a href="#">Соглашение об использовании</a>
    </div>
    <button type="button" class="button medium magenta" data-cookie-confirm>Принять</button>

    <button class="popup-close" data-cookie-close aria-label="Закрыть">
      <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
    </button>
  </div>
</div>
