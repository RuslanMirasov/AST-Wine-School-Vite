<!--LOGIN POPUP-->
<div class="popup-content" role="dialog" aria-modal="true" aria-labelledby="login-title" id="login">
  <h2 class="title title--24 bold" id="login-title">
    Вход
    <button class="popup-close" data-popup-close aria-label="Закрыть">
      <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
    </button>
  </h2>

  <script>
    function onLoginSubmit(e) {
      e.preventDefault();
      window.popup.open('login-code');
    }
  </script>

  <form data-form action="#" class="form form--grey" novalidate onsubmit="onLoginSubmit(event)">
    <label class="label">
      <span class="label-text">Email</span>
      <input type="email" name="email" class="input" placeholder="Email" required autocomplete="email" />
    </label>
    <button type="submit" class="button medium magenta">Далее</button>
  </form>

  <div class="buttons group">
    <p class="popup-subtitle">Войти с помощью:</p>
    <button type="button" class="button blue-border medium full">Яндекс ID</button>
    <button type="button" class="button blue-border medium full">ВКонтакте</button>
    <button type="button" class="button blue-border medium full">MAX</button>
  </div>
</div>

<!--LOGIN CODE POPUP-->
<div class="popup-content" id="login-code" role="dialog" aria-modal="true" aria-labelledby="login-code-title">
  <h2 class="title title--24 bold" id="login-title">
    Вход
    <button class="popup-close" data-popup-close aria-label="Закрыть">
      <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
    </button>
  </h2>
  <p class="popup-subtitle">Мы отправили проверочный код на&nbsp;ваш&nbsp;email. Введите&nbsp;его:</p>

  <script>
    function onLoginCodeSubmit(e) {
      e.preventDefault();

      const code = e.target.querySelector('input[name="code"]').value;

      console.log(code);

      window.popup.open('login-success');
      e.target.reset();
    }
  </script>

  <form data-form action="#" class="form form--grey" novalidate onsubmit="onLoginCodeSubmit(event)">
    <label class="label label-code">
      <input type="number" name="code" class="input" data-code="4" data-rule="code" required tabindex="-1" aria-hidden="true" />
    </label>

    <button type="button" class="link" data-popup-open="login">Назад</button>

    <div class="buttons ta--l">
      <button type="submit" class="button medium magenta">Подтвердить</button>
    </div>
  </form>
</div>

<!--LOGIN SUCCESS POPUP-->
<div class="popup-content" id="login-success" role="dialog" aria-modal="true" aria-labelledby="login-success-title">
  <h2 class="title title--24 bold" id="login-title">
    Вход
    <button class="popup-close" data-popup-close aria-label="Закрыть">
      <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
    </button>
  </h2>

  <p class="text full ta--l">С возвращением, <span>Константин</span>! <br />Рады приветствовать вас в&nbsp;Школе вина&nbsp;AST!</p>

  <div class="buttons ta--l">
    <button type="button" class="button medium magenta" data-popup-close>Закрыть</button>
  </div>
</div>
