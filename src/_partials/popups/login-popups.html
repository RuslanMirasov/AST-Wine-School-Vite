<!--LOGIN POPUP-->
<div class="popup-content" role="dialog" aria-modal="true" aria-labelledby="login-title" id="login">
  <h2 class="title title--24 bold" id="login-title">
    Вход
    <button class="popup-close" data-popup-close aria-label="Закрыть">
      <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
    </button>
  </h2>

  <script>
    function onLoginSubmit(e) {
      e.preventDefault();
      window.popup.open('login-code');
    }
  </script>

  <form data-form action="#" class="form grey-inputs" novalidate onsubmit="onLoginSubmit(event)">
    <label class="label">
      <span class="label-text">Email</span>
      <input type="email" name="email" class="input" placeholder="Email" required autocomplete="email" />
    </label>
    <button type="submit" class="button medium magenta">Далее</button>
  </form>

  <p class="popup-subtitle">Войти с помощью:</p>

  <div class="buttons group">
    <button type="button" class="button blue-border medium full">Яндекс ID</button>
    <button type="button" class="button blue-border medium full">ВКонтакте</button>
    <button type="button" class="button blue-border medium full">MAX</button>
  </div>
</div>

<!--LOGIN CODE POPUP-->
<div class="popup-content" id="login-code" data-popup-lock role="dialog" aria-modal="true" aria-labelledby="login-code-title">
  <h2 class="title title--30" id="login-code-title">Вход</h2>
  <p class="popup-subtitle">Мы отправили проверочный код на&nbsp;ваш&nbsp;email. Введите его:</p>

  <script>
    function onCodeInput(e) {
      const input = e.target;
      const fields = [...input.closest('.phone-code-fields').querySelectorAll('input[name^="code"]')];

      input.value = input.value.replace(/\D/g, '').slice(-1);

      const firstEmpty = fields.find(field => !field.value);
      if (firstEmpty) firstEmpty.focus();

      if (fields.every(field => field.value !== '')) {
        input.form.requestSubmit();
      }
    }

    function onCodeKeydown(e) {
      if (e.key !== 'Backspace' || e.target.value) return;

      const fields = [...e.target.closest('.phone-code-fields').querySelectorAll('input[name^="code"]')];
      const prev = fields[fields.indexOf(e.target) - 1];
      if (prev) prev.focus();
    }

    function onCodeCheckboxChange(e) {
      const form = e.target.form;
      const fields = [...form.querySelectorAll('input[name^="code"]')];
      if (fields.every(field => field.value !== '')) {
        form.requestSubmit();
      }
    }

    function onLoginCodeSubmit(e) {
      e.preventDefault();

      const fields = [...e.target.querySelectorAll('input[name^="code"]')];
      const code = fields.map(field => field.value).join('');

      console.log(code);

      window.popup.open('login-success');
      e.target.reset();
    }
  </script>
  <form data-form action="#" class="form" novalidate onsubmit="onLoginCodeSubmit(event)">
    <fieldset class="row phone-code-fields">
      <label class="label">
        <input
          type="number"
          name="code1"
          class="input"
          min="0"
          maxlength="1"
          required
          autocomplete="one-time-code"
          oninput="onCodeInput(event)"
          onkeydown="onCodeKeydown(event)"
        />
      </label>
      <label class="label">
        <input
          type="number"
          name="code2"
          class="input"
          min="0"
          maxlength="1"
          required
          autocomplete="one-time-code"
          oninput="onCodeInput(event)"
          onkeydown="onCodeKeydown(event)"
        />
      </label>
      <label class="label">
        <input
          type="number"
          name="code3"
          class="input"
          min="0"
          maxlength="1"
          required
          autocomplete="one-time-code"
          oninput="onCodeInput(event)"
          onkeydown="onCodeKeydown(event)"
        />
      </label>
      <label class="label">
        <input
          type="number"
          name="code4"
          class="input"
          min="0"
          maxlength="1"
          required
          autocomplete="one-time-code"
          oninput="onCodeInput(event)"
          onkeydown="onCodeKeydown(event)"
        />
      </label>
    </fieldset>

    <div class="form-errors" data-form-errors></div>
  </form>

  <button type="submit" class="button big" disabled>
    Запросить новый код
    <svg width="21" height="21"><use href="/assets/img/sprite.svg#arrow-right"></use></svg>
  </button>

  <p class="popup-subtitle">Запросить новый код можно через <span>04:59</span></p>
  <hr />

  <button type="button" class="popup-link" data-popup-open="login">Назад</button>
</div>

<!--LOGIN SUCCESS POPUP-->
<div class="popup-content" id="login-success" role="dialog" aria-modal="true" aria-labelledby="login-success-title">
  <button class="popup-close" data-popup-close aria-label="Закрыть">
    <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
  </button>
  <h2 class="title title--30" id="login-success-title">Вход</h2>
  <p class="popup-subtitle">С возвращением, <span>Константин</span>! <br />Рады приветствовать вас в&nbsp;Школе вина&nbsp;AST!</p>
  <button type="button" class="button big full" data-popup-close>
    Закрыть <svg width="21" height="21"><use href="/assets/img/sprite.svg#arrow-right"></use></svg>
  </button>
</div>
