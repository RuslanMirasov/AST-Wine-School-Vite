<!--BUY-LOGIN POPUP-->
<div class="popup-content" id="buy-login" role="dialog" aria-modal="true" aria-labelledby="buy-login-title">
  <button class="popup-close" data-popup-close aria-label="Закрыть">
    <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
  </button>
  <h2 class="title title--30" id="buy-login-title">Введите номер телефона</h2>
  <script>
    function onBuySubmit(e) {
      e.preventDefault();
      const phoneForCodeEl = document.querySelector('[data-phone-for-code]');
      if (!phoneForCodeEl) return;
      phoneForCodeEl.innerHTML = e.target.phone.value;
      window.popup.open('login-code');
    }
  </script>
  <form data-form action="#" class="form" novalidate onsubmit="onBuySubmit(event)">
    <label class="label">
      <input type="tel" name="phone" class="input" required placeholder="+7 ___ ___ __ __" autocomplete="tel" />
    </label>
    <button type="submit" class="button big magenta">
      Получить код
      <svg width="21" height="21"><use href="/assets/img/sprite.svg#arrow-right"></use></svg>
    </button>
  </form>
</div>

<!--BUY LOGIN SUCCESS POPUP-->
<div class="popup-content" id="buy-login-success" role="dialog" aria-modal="true" aria-labelledby="buy-login-success-title">
  <button class="popup-close" data-popup-close aria-label="Закрыть">
    <svg width="18" height="18"><use href="/assets/img/sprite.svg#close"></use></svg>
  </button>
  <h2 class="title title--30" id="buy-login-success-title">Вход выполнен</h2>
  <a href="%ROOT%cart/" class="button big">Перейти к&nbsp;оформлению</a>
</div>
