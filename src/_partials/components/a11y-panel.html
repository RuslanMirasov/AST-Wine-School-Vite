<div class="a11y-panel" role="region" aria-label="Настройки версии для слабовидящих" data-a11y-panel data-fixed>
  <div class="container">
    <div class="a11y-panel__item">
      <p>Размер шрифта:</p>

      <fieldset class="a11y-panel-group">
        <label class="a11y-option">
          <input type="radio" name="a11y-font-size" value="normal" aria-label="A — обычный шрифт" checked />
          <span>A</span>
        </label>
        <label class="a11y-option">
          <input type="radio" name="a11y-font-size" value="big" aria-label="A — увеличенный шрифт" />
          <span class="bigger">A</span>
        </label>
        <label class="a11y-option">
          <input type="radio" name="a11y-font-size" value="large" aria-label="A — самый крупный шрифт" />
          <span class="more-bigger">A</span>
        </label>
      </fieldset>
    </div>

    <div class="a11y-panel__item">
      <p>Интервал:</p>

      <fieldset class="a11y-panel-group">
        <label class="a11y-option">
          <input type="radio" name="a11y-spacing" value="normal" aria-label="Обычный интервал" checked />
          <span>
            <svg width="32" height="32" aria-hidden="true"><use href="/assets/img/sprite.svg#interval-1"></use></svg>
          </span>
        </label>
        <label class="a11y-option">
          <input type="radio" name="a11y-spacing" value="wide" aria-label="Увеличенный интервал" />
          <span>
            <svg width="32" height="32" aria-hidden="true"><use href="/assets/img/sprite.svg#interval-2"></use></svg>
          </span>
        </label>
        <label class="a11y-option">
          <input type="radio" name="a11y-spacing" value="wider" aria-label="Широкий интервал" />
          <span>
            <svg width="32" height="32" aria-hidden="true"><use href="/assets/img/sprite.svg#interval-3"></use></svg>
          </span>
        </label>
      </fieldset>
    </div>

    <div class="a11y-panel__item">
      <p>Тема:</p>

      <fieldset class="a11y-panel-group">
        <label class="a11y-option">
          <input type="radio" name="a11y-theme" value="color" aria-label="Цветная тема" checked />
          <span>
            <svg width="32" height="32" aria-hidden="true"><use href="/assets/img/sprite.svg#theme-light"></use></svg>
          </span>
        </label>
        <label class="a11y-option">
          <input type="radio" name="a11y-theme" value="dark" aria-label="Тёмная тема" />
          <span>
            <svg width="32" height="32" aria-hidden="true"><use href="/assets/img/sprite.svg#theme-dark"></use></svg>
          </span>
        </label>
      </fieldset>
    </div>

    <div class="a11y-panel__item">
      <p>Изображения:</p>

      <fieldset class="a11y-panel-group">
        <label class="a11y-option">
          <input type="radio" name="a11y-images" value="shown" checked />
          <span>ЦВ</span>
        </label>
        <label class="a11y-option">
          <input type="radio" name="a11y-images" value="grayscale" />
          <span>ЧБ</span>
        </label>
        <label class="a11y-option">
          <input type="radio" name="a11y-images" value="hidden" aria-label="Скрыть изображения" />
          <span>
            <svg width="15" height="15" aria-hidden="true"><use href="/assets/img/sprite.svg#close"></use></svg>
          </span>
        </label>
      </fieldset>
    </div>
  </div>
</div>
