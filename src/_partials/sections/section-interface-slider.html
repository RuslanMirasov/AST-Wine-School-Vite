<!--SECTION GALLERY SLIDER-->
<section class="section section--image-slider" data-slider data-slides-per-view="auto,auto,auto,auto" data-space-between="16,16,16,16">
  <div class="container">
    <h2 class="title title--32 upper">Интерфейс курса</h2>

    <div class="arrows auto ta--r">
      <load src="/_partials/components/slider-arrows.html" />
    </div>

    <div class="swiper interface-slider">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <div class="adult"><span>18+</span></div>
          <img src="/assets/img/interface/1.webp" alt="" class="interface-image" />
          <button
            type="button"
            class="interface-preview"
            data-gall="course-interface"
            data-vbtype="inline"
            data-href="#course-interface-rutube"
            aria-label="Видео RuTube (18+)"
            aria-haspopup="dialog"
          >
            <span class="player-play-button" aria-hidden="true">
              <svg width="12" height="13"><use href="/assets/img/sprite.svg#play"></use></svg>
            </span>
          </button>
        </div>

        <div class="swiper-slide">
          <img src="/assets/img/interface/2.webp" alt="" class="interface-image" />
          <button
            type="button"
            class="interface-preview"
            data-gall="course-interface"
            data-href="%ROOT%assets/img/interface/2.webp"
            aria-label="Список уроков курса"
            aria-haspopup="dialog"
          ></button>
        </div>

        <div class="swiper-slide">
          <img src="/assets/img/interface/3.webp" alt="" class="interface-image" />
          <button
            type="button"
            class="interface-preview"
            data-gall="course-interface"
            data-vbtype="inline"
            data-href="#course-interface-vk"
            aria-label="Видео VK"
            aria-haspopup="dialog"
          >
            <span class="player-play-button" aria-hidden="true">
              <svg width="12" height="13"><use href="/assets/img/sprite.svg#play"></use></svg>
            </span>
          </button>
        </div>

        <div class="swiper-slide">
          <img src="/assets/img/interface/1.webp" alt="" class="interface-image" />
          <button
            type="button"
            class="interface-preview"
            data-gall="course-interface"
            data-vbtype="video"
            data-href="https://assets.mixkit.co/videos/22734/22734-720.mp4"
            aria-label="Видео с хостинга"
            aria-haspopup="dialog"
          >
            <span class="player-play-button" aria-hidden="true">
              <svg width="12" height="13"><use href="/assets/img/sprite.svg#play"></use></svg>
            </span>
          </button>
        </div>

        <div class="swiper-slide">
          <img src="/assets/img/interface/2.webp" alt="" class="interface-image" />
          <button
            type="button"
            class="interface-preview"
            data-gall="course-interface"
            data-href="%ROOT%assets/img/interface/2.webp"
            aria-label="Список уроков курса"
            aria-haspopup="dialog"
          ></button>
        </div>

        <div class="swiper-slide">
          <img src="/assets/img/interface/3.webp" alt="" class="interface-image" />
          <button
            type="button"
            class="interface-preview"
            data-gall="course-interface"
            data-href="%ROOT%assets/img/interface/3.webp"
            aria-label="Страница видеоурока"
            aria-haspopup="dialog"
          ></button>
        </div>
      </div>
    </div>

    <template id="course-interface-rutube">
      <iframe
        class="video-iframe course-video-embed"
        src="https://rutube.ru/play/embed/b13d20a52eb4d25190a913abf70ebd7d"
        title="Видео RuTube"
        allow="clipboard-write; autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
      ></iframe>
    </template>

    <template id="course-interface-vk">
      <iframe
        class="video-iframe course-video-embed"
        src="https://vkvideo.ru/video_ext.php?oid=-238248247&amp;id=456239021&amp;hd=4"
        title="Видео VK"
        allow="clipboard-write; autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
      ></iframe>
    </template>
  </div>
</section>
