<!doctype html>
<html lang="ru">
  <head>
    <load src="/_partials/base/metrix.html" />
    <load src="/_partials/base/meta.html" />
    <load src="/_partials/base/styles.html" />
    <meta name="description" content="AST - Личный кабинет" />
    <title>Личный кабинет</title>
  </head>
  <body class="body">
    <!--START SCRIPTS-->
    <load src="/_partials/base/start-scripts.html" />
    <!--HEADER-->
    <load src="/_partials/preloader.html" />
    <load src="/_partials/components/header/header.html" />

    <!--MAIN-->
    <main class="main" id="main" tabindex="-1">
      <!--breadcrumbs-->
      <ul class="breadcrumbs">
        <li><a href="%ROOT%">Главная</a></li>
        <li><a href="%ROOT%profile/">Личный кабинет</a></li>
        <li><a href="%ROOT%profile/referral-program/">Реферальная программа</a></li>
        <li><span>Редактирование</span></li>
      </ul>

      <section class="section pad--32">
        <div class="container">
          <h1 class="title title--40 upper">Личный кабинет</h1>
        </div>
      </section>

      <section class="page">
        <div class="container">
          <!--SIDEBAR-->
          <aside class="sidebar small left-side" data-sticky-sidebar>
            <load src="/_partials/components/profile/profile-neme.html" />
            <load src="/_partials/components/menus/profile-menu.html" />
          </aside>

          <!--PROFILE MOBIL MENU BUTTON-->
          <button type="button" class="profile-mobil-menu-button" data-popup-open="profile-navigation">
            <svg width="20" height="20"><use href="/assets/img/sprite.svg#referals"></use></svg>
            <span>Реферальная программа</span>
            <svg width="30" height="24"><use href="/assets/img/sprite.svg#menu"></use></svg>
          </button>

          <!--PAGE CONTENT-->
          <div class="page-content">
            <div class="profile-content profile-info" data-tabs data-unanimated>
              <h2 class="title title--32 upper">Настройки выплат</h2>

              <div class="buttons full ta--l gap--12">
                <button type="button" class="button button--tab active" data-tab-target="individual"><span>Физическое лицо</span></button>
                <button type="button" class="button button--tab" data-tab-target="legal-entity"><span>Юридическое лицо</span></button>
              </div>

              <form data-form action="#" class="form" novalidate>
                <fieldset class="col--2">
                  <label class="label">
                    <span class="label-text">Фамилия *</span>
                    <input
                      type="text"
                      name="sername"
                      class="input"
                      data-rule="name-cyrillic"
                      minlength="2"
                      required
                      value="Черноморепоколенопереходященский"
                      data-required-error-text="Пожалуйста, укажите вашу фамилию"
                    />
                  </label>

                  <label class="label">
                    <span class="label-text">Имя *</span>
                    <input type="text" name="name" class="input" data-rule="name-cyrillic" minlength="2" required value="Константин" data-required-error-text="Пожалуйста, укажите ваше имя" />
                  </label>
                </fieldset>

                <fieldset class="col--2">
                  <label class="label">
                    <span class="label-text">Отчество</span>
                    <input type="text" name="lastname" class="input" data-rule="name-cyrillic" minlength="2" value="Братиславович" />
                  </label>

                  <label class="label" data-tab="individual">
                    <span class="label-text">ИНН *</span>
                    <input type="text" name="inn" class="input" required inputmode="numeric" data-digits maxlength="12" value="0123456789" data-rule="inn" data-rule-error-text="Пожалуйста, укажите корректный ИНН: 10 цифр для организации или 12 для ИП" data-required-error-text="Пожалуйста, укажите ИНН" />
                  </label>
                </fieldset>

                <h3 class="title title--24 bold">Банковские реквизиты</h3>

                <fieldset class="col--2">
                  <label class="label" data-tab="legal-entity">
                    <span class="label-text">Наименование юридического лица *</span>
                    <input type="text" name="legal-entity-name" class="input" required="" value="" placeholder="Наименование" data-invoice-field="" data-required-error-text="Пожалуйста, укажите наименование юридического лица" />
                  </label>

                  <label class="label" data-tab="legal-entity">
                    <span class="label-text">Юридический адрес *</span>
                    <input type="text" name="adress" class="input" required="" value="" placeholder="Адрес" data-invoice-field="" data-required-error-text="Пожалуйста, укажите юридический адрес" />
                  </label>

                  <label class="label">
                    <span class="label-text">Расчетный счет *</span>
                    <input
                      type="text"
                      name="checking-account"
                      class="input"
                      required
                      inputmode="numeric"
                      maxlength="20"
                      value="40817810099910004320"
                      data-required-error-text="Пожалуйста, укажите расчётный счёт"
                    />
                  </label>

                  <label class="label">
                    <span class="label-text">БИК *</span>
                    <input type="text" name="bik" class="input" required inputmode="numeric" maxlength="9" value="044525225" data-required-error-text="Пожалуйста, укажите БИК" />
                  </label>
                </fieldset>

                <fieldset class="col--2">
                  <label class="label">
                    <span class="label-text">Корреспондентский счет *</span>
                    <input
                      type="text"
                      name="correspondent-account"
                      class="input"
                      required
                      inputmode="numeric"
                      maxlength="20"
                      value="30101810400000000220"
                      data-required-error-text="Пожалуйста, укажите корреспондентский счёт"
                    />
                  </label>

                  <label class="label">
                    <span class="label-text">Наименование банка *</span>
                    <input type="text" name="bank-name" class="input" required value="ПАО Сбербанк" data-required-error-text="Пожалуйста, укажите наименование банка" />
                  </label>

                  <label class="label" data-tab="legal-entity">
                    <span class="label-text">ИНН *</span>
                    <input type="text" name="inn" class="input" required inputmode="numeric" data-digits maxlength="12" value="0123456789" data-rule="inn" data-rule-error-text="Пожалуйста, укажите корректный ИНН: 10 цифр для организации или 12 для ИП" data-required-error-text="Пожалуйста, укажите ИНН" />
                  </label>

                  <label class="label" data-tab="legal-entity">
                    <span class="label-text">КПП *</span>
                    <input
                      type="text"
                      name="kpp"
                      class="input"
                      required=""
                      inputmode="numeric" data-digits
                      maxlength="9"
                      data-rule="kpp"
                      value=""
                      placeholder="9 цифр"
                      data-invoice-field=""
                      data-rule-error-text="Пожалуйста, укажите корректный КПП: 9 цифр"
                      data-required-error-text="Пожалуйста, укажите КПП"
                    />
                  </label>
                </fieldset>

                <div class="buttons ta--l gap--12">
                  <button type="submit" class="button"><span>Сохранить</span></button>
                  <a href="%ROOT%profile/referral-program/" class="button white-border"><span>Отмена</span></a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!--FOOTER-->
    <load src="/_partials/footer.html" />

    <!--POPUPS-->
    <div class="backdrop" data-backdrop>
      <div class="popup" data-popup>
        <load src="/_partials/base/default-popups.html" />
        <load src="/_partials/popups/lk-popups.html" />
      </div>
    </div>

    <!--COOKIE CONFIRM POPUP-->
    <load src="/_partials/popups/cookies-confirm-popup.html" />

    <!--SCRIPTS-->
    <load src="/_partials/base/scripts.html" />
  </body>
</html>
