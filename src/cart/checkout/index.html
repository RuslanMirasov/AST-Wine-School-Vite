<!doctype html>
<html lang="ru">
  <head>
    <load src="/_partials/base/metrix.html" />
    <load src="/_partials/base/meta.html" />
    <load src="/_partials/base/styles.html" />
    <meta name="description" content="AST - Оформление заказа" />
    <title>Оформление заказа</title>
  </head>
  <body class="body">
    <!--START SCRIPTS-->
    <load src="/_partials/base/start-scripts.html" />
    <!--HEADER-->
    <load src="/_partials/preloader.html" />
    <load src="/_partials/components/header/header.html" />

    <!--MAIN-->
    <main class="main" id="main" tabindex="-1">
      <!--breadcrumbs-->
      <ul class="breadcrumbs">
        <li><a href="%ROOT%">Главная</a></li>
        <li><a href="%ROOT%cart/">Корзина</a></li>
        <li><span>Оформление заказа</span></li>
      </ul>

      <section class="section">
        <div class="container">
          <div class="content-text gap--40">
            <h1 class="title title--40 upper">Оформление заказа</h1>

            <ul class="cart-steps">
              <li class="active"><span>Корзина</span></li>
              <li class="current"><span>Оформление</span></li>
              <li><span>Оплата</span></li>
              <li><span>Готово</span></li>
            </ul>
          </div>
        </div>
      </section>

      <section class="page" data-tabs="entity" data-unanimated>
        <div class="container gap--24">
          <!--SIDEBAR-->
          <aside class="sidebar gap--8 right-side" data-sticky-sidebar>
            <load src="/_partials/components/cart/order-yours.html" />
            <load src="/_partials/components/cart/order-details.html" />
            <load src="/_partials/components/cart/payment-protected.html" />
          </aside>

          <!--PAGE CONTENT-->
          <div class="page-content">
            <div class="profile-content customer-data">
              <h2 class="title title--32 upper">Данные покупателя</h2>

              <div class="buttons full ta--l gap--12">
                <button type="button" class="button button--tab active" data-tab-target="individual"><span>Физическое лицо</span></button>
                <button type="button" class="button button--tab" data-tab-target="legal-entity"><span>Юридическое лицо</span></button>
              </div>

              <!--ФИЗИЧЕСКОЕ ЛИЦО-->
              <form data-form action="%ROOT%cart/success/" class="form" id="cart-checkout-form" novalidate>
                <fieldset class="col--2">
                  <label class="label">
                    <span class="label-text">Фамилия *</span>
                    <input type="text" name="sername" class="input" data-rule="name-cyrillic" minlength="2" required value="" />
                  </label>

                  <label class="label">
                    <span class="label-text">Имя *</span>
                    <input type="text" name="name" class="input" data-rule="name-cyrillic" minlength="2" required value="" />
                  </label>

                  <label class="label">
                    <span class="label-text">Отчество</span>
                    <input type="text" name="lastname" class="input" data-rule="name-cyrillic" minlength="2" value="" />
                  </label>
                </fieldset>

                <fieldset class="col--2">
                  <label class="label">
                    <span class="label-text">Электронная почта *</span>
                    <input type="email" name="email" class="input" required autocomplete="email" />
                  </label>

                  <label class="label">
                    <span class="label-text">Номер телефона *</span>
                    <input type="tel" name="phone" class="input" required />
                  </label>

                  <label class="label" data-tab="individual">
                    <span class="label-text">Дата рождения *</span>
                    <input type="date" name="birthday" class="input" required value="" placeholder="(выберите дату)" />
                  </label>

                  <p class="text fs-12 grey-text" data-tab="individual">Участие в мероприятиях доступно только с 18 лет.</p>
                </fieldset>

                <fieldset class="col--2" data-tab="legal-entity">
                  <label class="label">
                    <span class="label-text">Наименование юридического лица</span>
                    <input type="text" name="legal-entity-name" class="input" required value="" placeholder="Наименование" data-invoice-field />
                  </label>

                  <label class="label">
                    <span class="label-text">ИНН *</span>
                    <input
                      type="number"
                      name="inn"
                      class="input"
                      required
                      inputmode="numeric"
                      maxlength="12"
                      data-rule="inn"
                      value=""
                      placeholder="10 или 12 цифр"
                      data-invoice-field
                    />
                  </label>
                </fieldset>

                <fieldset class="col--2" data-tab="legal-entity">
                  <label class="label">
                    <span class="label-text">Юридический адрес</span>
                    <input type="text" name="adress" class="input" required value="" placeholder="Адрес" data-invoice-field />
                  </label>

                  <label class="label">
                    <span class="label-text">КПП</span>
                    <input
                      type="number"
                      name="kpp"
                      class="input"
                      required
                      inputmode="numeric"
                      maxlength="9"
                      data-rule="kpp"
                      value=""
                      placeholder="9 цифр"
                      data-invoice-field
                    />
                  </label>
                </fieldset>
              </form>

              <!--ЮРИДИЧЕСКОЕ ЛИЦО-->
            </div>
          </div>
        </div>
      </section>
    </main>

    <!--FOOTER-->
    <load src="/_partials/footer.html" />

    <!--POPUPS-->
    <div class="backdrop" data-backdrop>
      <div class="popup" data-popup>
        <load src="/_partials/base/default-popups.html" />
      </div>
    </div>

    <!--COOKIE CONFIRM POPUP-->
    <load src="/_partials/popups/cookies-confirm-popup.html" />

    <!--SCRIPTS-->
    <load src="/_partials/base/scripts.html" />
  </body>
</html>
